services:
  - type: web
    name: jru-gi-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/download_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_API_KEY
        sync: false
      - key: PRIMARY_MODEL
        value: qwen/qwen3.8-27b
      - key: FALLBACK_MODEL
        value: openai/gpt-oss-120b
      - key: RATE_LIMIT_PER_MINUTE
        value: "6"
